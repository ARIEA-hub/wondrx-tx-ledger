spring.application.name=tx-ledger

# In-memory H2 database - zero config, fresh DB per run, shared across the app's connection pool
spring.datasource.url=jdbc:h2:mem:txledger;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Keep the pool small but >1 so concurrent requests really get separate DB connections,
# which is what makes the pessimistic-lock / unique-constraint tests meaningful.
spring.datasource.hikari.maximum-pool-size=15

server.port=0
